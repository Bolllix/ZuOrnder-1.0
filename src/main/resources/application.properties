# ============================================================================
# Einstellungen für das Spring-Boot-Backend
# ============================================================================
# Der Platzhalter @project.version@ wird beim Bauen (mvn package / mvn test /
# mvn spring-boot:run) automatisch durch die <version> aus der pom.xml ersetzt.
# Der SystemController liest diesen Wert und zeigt ihn in der App an.
zuordner.version=@project.version@
